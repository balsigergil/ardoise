# CI (ARCHITECTURE §14): checks on every push, integration on PRs and main,
# image build + e2e against the compose stack on main.
name: CI

on:
  push:
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  checks:
    name: Lint, typecheck, unit, licenses, SPDX
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v5
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm check:licenses
      - run: pnpm check:spdx
      - run: pnpm lint
      - run: pnpm typecheck
      - run: pnpm test

  integration:
    name: Integration (Testcontainers)
    if: github.event_name == 'pull_request' || github.ref == 'refs/heads/main'
    needs: checks
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v5
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm test:integration

  image-e2e:
    name: Docker image + e2e on the compose stack
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: checks
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v5
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Generate throwaway secrets
        run: |
          secret() { node -e "console.log(require('crypto').randomBytes(32).toString('base64url'))"; }
          {
            echo "ARDOISE_SECRET_KEY=$(secret)"
            echo "POSTGRES_PASSWORD=$(secret)"
            echo "S3_SECRET_KEY=$(secret)"
          } > docker/.env
      - name: Build image and start the stack
        run: docker compose -f docker/docker-compose.yml up --build --detach --wait
      - name: Readiness
        run: curl --fail --silent --show-error http://localhost:3000/readyz
      - run: pnpm --filter @ardoise/e2e exec playwright install --with-deps chromium
      - run: pnpm test:e2e
        env:
          E2E_BASE_URL: http://localhost:3000
      - name: Stack logs
        if: failure()
        run: docker compose -f docker/docker-compose.yml logs
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-report
          path: e2e/playwright-report
          retention-days: 7
