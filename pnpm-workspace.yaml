packages:
  - apps/*
  - packages/*
  - e2e

# Required by `pnpm deploy` to produce a self-contained server bundle for the image.
injectWorkspacePackages: true

# Dependencies allowed to run install scripts (pnpm blocks them by default).
allowBuilds:
  esbuild: true
  # Optional native accelerators / post-install notices pulled by Testcontainers: not needed.
  cpu-features: false
  protobufjs: false
  ssh2: false
  # Optional native MessagePack accelerator pulled by BullMQ; the JS fallback is used.
  msgpackr-extract: false

minimumReleaseAgeExclude:
  - i18next@27.2.4
